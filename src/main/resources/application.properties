server.port=8080
spring.application.name=email-auth-java

# 资源上限（可通过环境变量覆盖）
emailauth.limits.max-message-bytes=10485760
emailauth.limits.max-header-bytes=16384
emailauth.limits.max-headers=256
emailauth.limits.max-header-line-bytes=8192
emailauth.limits.max-dns-response-bytes=65535
emailauth.limits.max-include-depth=8
emailauth.limits.max-dns-queries=64
emailauth.limits.max-signatures=16

# DNS 缓存
emailauth.dns.timeout-millis=3000
emailauth.dns.cache-ttl-seconds=300
emailauth.dns.nxdomain-ttl-seconds=60
emailauth.dns.malformed-ttl-seconds=60
emailauth.dns.timeout-ttl-seconds=5

# 聚合反馈报告
emailauth.report.storage-path=data/report
emailauth.report.interval-seconds=86400
