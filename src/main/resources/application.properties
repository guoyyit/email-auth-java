spring.application.name=email-auth-java

# ---- 邮件输入上限 ----
email-auth.limits.max-message-bytes=2097152
email-auth.limits.max-header-line-bytes=65536
email-auth.limits.max-header-bytes=524288
email-auth.limits.max-headers=1000
email-auth.limits.max-dns-response-bytes=16384
email-auth.limits.max-signed-headers=256

# ---- SPF ----
email-auth.spf.max-include-depth=10
email-auth.spf.max-dns-queries=30
email-auth.spf.max-void-lookups=2

# ---- DKIM ----
email-auth.dkim.max-signatures=10
email-auth.dkim.expiry-skew-seconds=0

# ---- DMARC ----
# 额外多标签私有后缀（逗号分隔），例如 co.uk
email-auth.dmarc.private-suffixes=

# ---- DNS 缓存（秒）----
email-auth.cache.max-positive-ttl-seconds=86400
email-auth.cache.nxdomain-ttl-seconds=300
email-auth.cache.malformed-ttl-seconds=60
email-auth.cache.timeout-ttl-seconds=0

# ---- 聚合报告 ----
email-auth.report.enabled=true
email-auth.report.store-dir=data/aggregate
email-auth.report.report-receiver=receiver.example
